name: Migrate

# Neon DB 에 대기 중인 마이그레이션을 수동으로 적용한다.
#
# 자동 트리거는 없다. workflow_dispatch 로만 실행되며, 실수로 버튼을 눌러
# 프로덕션 DB 가 바뀌는 일을 막기 위해 confirm 입력이 정확히 'migrate' 일 때만
# 진행한다.
#
# DATABASE_URL 은 GitHub 시크릿에만 존재한다. 로컬로 내려받지 않고 로그에도
# 찍지 않는다. 마이그레이션을 실행하는 스텝에만 env 로 주입한다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "프로덕션 DB 를 변경한다. 진행하려면 migrate 라고 입력한다."
        required: true
        type: string

concurrency:
  group: migrate-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 최소 권한. 체크아웃에 필요한 읽기만 쓴다.
permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check confirmation and database configuration
        id: guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          USE_NEON: ${{ vars.USE_NEON }}
          # 값 자체는 쓰지 않고 비어 있는지만 확인한다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # GITHUB_OUTPUT 에는 마지막에 한 번만 쓴다. 같은 키를 두 번 쓰면
          # 어느 값이 남는지 헷갈린다.
          skip() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$CONFIRM" != "migrate" ]; then
            {
              echo "### ⏭️ 마이그레이션 건너뜀"
              echo ""
              echo "confirm 입력이 \`migrate\` 가 아닙니다. 아무것도 실행하지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "confirm 입력이 'migrate' 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ "$USE_NEON" != "true" ]; then
            {
              echo "### ⏭️ 마이그레이션 건너뜀"
              echo ""
              echo "\`USE_NEON\` variable 이 \`true\` 가 아닙니다."
              echo ""
              echo "켜려면: \`gh variable set USE_NEON --body true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "USE_NEON 이 true 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ -z "$DATABASE_URL" ]; then
            {
              echo "### ⏭️ 마이그레이션 건너뜀"
              echo ""
              echo "\`DATABASE_URL\` 시크릿이 없습니다."
              echo ""
              echo "Neon 콘솔의 연결 문자열을 \`gh secret set DATABASE_URL\` 로 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DATABASE_URL 시크릿이 비어 있습니다. 건너뜁니다."
            skip
          fi

          if ! ls migrations/*.sql >/dev/null 2>&1; then
            {
              echo "### ⏭️ 마이그레이션 건너뜀"
              echo ""
              echo "\`migrations/\` 에 SQL 파일이 없습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "마이그레이션 파일이 없습니다. 건너뜁니다."
            skip
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Show pending migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:status

      - name: Apply migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Show migration status after apply
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:status
