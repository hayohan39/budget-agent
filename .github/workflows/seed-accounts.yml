name: Seed accounts

# 계좌 3개(메인 · 고정비 · 비상금)를 accounts 테이블에 수동으로 등록한다.
#
# 자동 트리거는 없다. workflow_dispatch 로만 실행되며, 실수로 버튼을 눌러
# 프로덕션 DB 가 바뀌는 일을 막기 위해 confirm 입력이 정확히 'seed' 일 때만
# 진행한다.
#
# 계좌번호 뒤 4자리는 workflow_dispatch 입력으로 받지 않는다. dispatch 입력은
# 실행 기록에 평문으로 남아 누구나 다시 읽을 수 있다. ACCOUNT_LAST4_* 시크릿으로
# 받아 GitHub 이 로그에서 마스킹하게 한다.
#
# DATABASE_URL 과 ACCOUNT_LAST4_* 는 GitHub 시크릿에만 존재한다. 값은 어디에도
# 출력하지 않고, 실행하는 스텝에만 env 로 주입한다. 가드는 비어 있는지만 본다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "프로덕션 DB 에 계좌를 등록한다. 진행하려면 seed 라고 입력한다."
        required: true
        type: string

concurrency:
  group: seed-accounts-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 최소 권한. 체크아웃에 필요한 읽기만 쓴다.
permissions:
  contents: read

jobs:
  seed:
    name: Seed accounts table
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check confirmation and seed configuration
        id: guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          USE_NEON: ${{ vars.USE_NEON }}
          # 값 자체는 쓰지 않고 비어 있는지만 확인한다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIN: ${{ secrets.ACCOUNT_LAST4_MAIN }}
          FIXED: ${{ secrets.ACCOUNT_LAST4_FIXED }}
          EMERGENCY: ${{ secrets.ACCOUNT_LAST4_EMERGENCY }}
        run: |
          # GITHUB_OUTPUT 에는 마지막에 한 번만 쓴다. 같은 키를 두 번 쓰면
          # 어느 값이 남는지 헷갈린다.
          skip() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$CONFIRM" != "seed" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "confirm 입력이 \`seed\` 가 아닙니다. 아무것도 실행하지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "confirm 입력이 'seed' 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ "$USE_NEON" != "true" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`USE_NEON\` variable 이 \`true\` 가 아닙니다."
              echo ""
              echo "켜려면: \`gh variable set USE_NEON --body true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "USE_NEON 이 true 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ -z "$DATABASE_URL" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`DATABASE_URL\` 시크릿이 없습니다."
              echo ""
              echo "Neon 콘솔의 연결 문자열을 \`gh secret set DATABASE_URL\` 로 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DATABASE_URL 시크릿이 비어 있습니다. 건너뜁니다."
            skip
          fi

          # 비어 있는지만 본다. 값도, 자릿수도 출력하지 않는다.
          # 형식 검증(4자리 숫자 · 중복 금지)은 seed-accounts.mjs 가 한다.
          missing=()
          [ -n "$MAIN" ]      || missing+=(ACCOUNT_LAST4_MAIN)
          [ -n "$FIXED" ]     || missing+=(ACCOUNT_LAST4_FIXED)
          [ -n "$EMERGENCY" ] || missing+=(ACCOUNT_LAST4_EMERGENCY)

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "다음 시크릿이 없습니다: \`${missing[*]}\`"
              echo ""
              echo "계좌번호 뒤 4자리를 Settings > Secrets and variables > Actions 에서"
              echo "각각 리포지토리 시크릿으로 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ACCOUNT_LAST4_* 시크릿이 비어 있습니다. 건너뜁니다."
            skip
          fi

          # 이 스크립트는 기능 브랜치에만 있다. main 을 ref 로 잘못 dispatch 하면
          # 여기서 안전하게 멈춘다.
          if [ ! -f scripts/seed-accounts.mjs ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`scripts/seed-accounts.mjs\` 가 이 ref 에 없습니다."
              echo ""
              echo "스크립트가 있는 브랜치를 ref 로 지정해 다시 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "seed-accounts.mjs 가 없습니다. 건너뜁니다."
            skip
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Seed accounts
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIN: ${{ secrets.ACCOUNT_LAST4_MAIN }}
          FIXED: ${{ secrets.ACCOUNT_LAST4_FIXED }}
          EMERGENCY: ${{ secrets.ACCOUNT_LAST4_EMERGENCY }}
        # 스크립트는 건수와 역할만 출력한다. 뒤 4자리는 로그에 남지 않는다.
        run: npm run accounts:seed -- main="$MAIN" fixed="$FIXED" emergency="$EMERGENCY"
