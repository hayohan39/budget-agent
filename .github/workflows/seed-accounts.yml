name: Seed accounts

# 계좌 3개(메인 · 고정비 · 비상금)를 accounts 테이블에 수동으로 등록한다.
#
# 자동 트리거는 없다. workflow_dispatch 로만 실행되며, 실수로 버튼을 눌러
# 프로덕션 DB 가 바뀌는 일을 막기 위해 confirm 입력이 정확히 'seed' 일 때만
# 진행한다.
#
# 계좌번호 뒤 4자리는 workflow_dispatch 입력으로 받지 않는다. dispatch 입력은
# 실행 기록에 평문으로 남아 누구나 다시 읽을 수 있다. ACCOUNT_LAST4_* 시크릿으로
# 받는다.
#
# 시크릿 값은 명령줄 인자로 넘기지 않고 env 로만 준다. `npm run` 은 실행 전에
# 해석된 명령줄을 로그에 출력하므로, 인자로 넘기면 GitHub 마스킹이 유일한
# 방어선이 된다. CI 로그는 영구 저장되므로 한 번 새면 되돌릴 수 없다.
#
# DATABASE_URL 과 ACCOUNT_LAST4_* 는 GitHub 시크릿에만 존재한다. 값은 어디에도
# 출력하지 않고, 실행하는 스텝에만 env 로 주입한다. 가드는 비어 있는지만 본다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "프로덕션 DB 에 계좌를 등록한다. 진행하려면 seed 라고 입력한다."
        required: true
        type: string

concurrency:
  group: seed-accounts-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 최소 권한. 체크아웃에 필요한 읽기만 쓴다.
permissions:
  contents: read

jobs:
  seed:
    name: Seed accounts table
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check confirmation and seed configuration
        id: guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          USE_NEON: ${{ vars.USE_NEON }}
          # 값 자체는 쓰지 않고 비어 있는지만 확인한다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCOUNT_LAST4_MAIN: ${{ secrets.ACCOUNT_LAST4_MAIN }}
          ACCOUNT_LAST4_FIXED: ${{ secrets.ACCOUNT_LAST4_FIXED }}
          ACCOUNT_LAST4_EMERGENCY: ${{ secrets.ACCOUNT_LAST4_EMERGENCY }}
        run: |
          # GITHUB_OUTPUT 에는 마지막에 한 번만 쓴다. 같은 키를 두 번 쓰면
          # 어느 값이 남는지 헷갈린다.
          skip() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$CONFIRM" != "seed" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "confirm 입력이 \`seed\` 가 아닙니다. 아무것도 실행하지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "confirm 입력이 'seed' 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ "$USE_NEON" != "true" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`USE_NEON\` variable 이 \`true\` 가 아닙니다."
              echo ""
              echo "켜려면: \`gh variable set USE_NEON --body true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "USE_NEON 이 true 가 아닙니다. 건너뜁니다."
            skip
          fi

          if [ -z "$DATABASE_URL" ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`DATABASE_URL\` 시크릿이 없습니다."
              echo ""
              echo "Neon 콘솔의 연결 문자열을 \`gh secret set DATABASE_URL\` 로 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DATABASE_URL 시크릿이 비어 있습니다. 건너뜁니다."
            skip
          fi

          # 비어 있는지만 본다. 값도, 자릿수도 출력하지 않는다.
          # 형식 검증(4자리 숫자 · 중복 금지)은 seed-accounts.mjs 가 한다.
          missing=()
          [ -n "$ACCOUNT_LAST4_MAIN" ]      || missing+=(ACCOUNT_LAST4_MAIN)
          [ -n "$ACCOUNT_LAST4_FIXED" ]     || missing+=(ACCOUNT_LAST4_FIXED)
          [ -n "$ACCOUNT_LAST4_EMERGENCY" ] || missing+=(ACCOUNT_LAST4_EMERGENCY)

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "다음 시크릿이 없습니다: \`${missing[*]}\`"
              echo ""
              echo "계좌번호 뒤 4자리를 Settings > Secrets and variables > Actions 에서"
              echo "각각 리포지토리 시크릿으로 넣으세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ACCOUNT_LAST4_* 시크릿이 비어 있습니다. 건너뜁니다."
            skip
          fi

          # 이 스크립트는 기능 브랜치에만 있다. main 을 ref 로 잘못 dispatch 하면
          # 여기서 안전하게 멈춘다.
          if [ ! -f scripts/seed-accounts.mjs ]; then
            {
              echo "### ⏭️ 계좌 등록 건너뜀"
              echo ""
              echo "\`scripts/seed-accounts.mjs\` 가 이 ref 에 없습니다."
              echo ""
              echo "스크립트가 있는 브랜치를 ref 로 지정해 다시 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "seed-accounts.mjs 가 없습니다. 건너뜁니다."
            skip
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Seed accounts
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCOUNT_LAST4_MAIN: ${{ secrets.ACCOUNT_LAST4_MAIN }}
          ACCOUNT_LAST4_FIXED: ${{ secrets.ACCOUNT_LAST4_FIXED }}
          ACCOUNT_LAST4_EMERGENCY: ${{ secrets.ACCOUNT_LAST4_EMERGENCY }}
        # 값은 인자가 아니라 env 로만 넘긴다. `npm run` 은 실행 전에 해석된 명령줄
        # (`> node scripts/seed-accounts.mjs ...`)을 로그에 출력하므로, 인자로 넘기면
        # 뒤 4자리가 로그에 쓰이고 GitHub 마스킹만이 그것을 가린다. env 로 넘기면
        # 애초에 로그에 쓰이지 않고, 마스킹은 유일한 방어선이 아니라 최후 방어선으로
        # 남는다. 스크립트는 건수와 역할만 출력한다.
        run: npm run accounts:seed
